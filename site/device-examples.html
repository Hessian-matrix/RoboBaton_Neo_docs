<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>运行位姿示例 · RoboBaton Neo</title><style>
:root{color-scheme:light dark;--bg:#f5f8f6;--panel:white;--text:#193b30;--muted:#60786e;--line:#d8e5de;--accent:#32765d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.6 system-ui,sans-serif}header{padding:20px;max-width:960px;margin:auto;display:flex;justify-content:space-between;gap:15px}a{color:var(--accent)}main{max-width:650px;margin:45px auto;padding:0 20px}h1{font-size:32px;margin:8px 0}p{color:var(--muted)}form{padding:26px;border:1px solid var(--line);border-radius:16px;background:var(--panel);margin-top:24px}label{display:block;margin:14px 0 6px}input,select{font:inherit;width:100%;padding:12px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--text)}button{font:inherit;padding:12px 18px;border:0;border-radius:8px;background:var(--accent);color:white;margin-top:24px;cursor:pointer}small{display:block;color:var(--muted);margin-top:10px}#error{color:#b13d38}details{margin-top:22px;font-size:14px}summary{cursor:pointer}@media(prefers-color-scheme:dark){:root{--bg:#111b17;--panel:#19251f;--text:#dceae1;--muted:#a0b8a9;--line:#33483c;--accent:#60a486}}@media(max-width:420px){main{margin:25px auto}h1{font-size:27px}form{padding:18px}header{font-size:14px}}
.embedded header{display:none}.embedded body{background:transparent}.embedded main{max-width:850px;margin:0 auto;padding:20px 20px 35px}.release-status{padding:12px 16px;border:1px solid var(--line);border-radius:8px;font-size:14px}.embedded h1{font-size:30px}@media(max-width:420px){.embedded h1{font-size:25px}}
</style></head><body><header><a href="index.html">RoboBaton Neo</a><a href="quick-start.html">返回快速开始</a></header><main><h1>选择语言，读取真实位姿</h1><p>连接 Neo USB 网络，直接在设备网页运行。无需安装软件或电脑连接工具。</p><p class="release-status">三语言示例已完成开发与实机数据验证；当前正式设备尚未安装示例页，需随配套版本发布后使用。</p><form id="open-example"><label for="address">设备地址</label><input id="address" value="192.168.11.1" placeholder="192.168.11.1" inputmode="url" spellcheck="false" required><label for="language">示例语言</label><select id="language"><option value="python">Python · 浏览器执行</option><option value="cpp">C++ · WebAssembly</option><option value="rust">Rust · WebAssembly</option></select><button type="submit">打开设备示例页 →</button><small>将在新窗口打开设备网页，请在设备页点击“运行示例”。</small><p id="error" role="status"></p></form><details><summary>运行要求</summary><p>设备应用需要包含“代码示例”页。若打开后显示找不到页面，当前设备尚未配套此功能；此产品站不能替设备添加接口或绕过浏览器限制。</p><p>Python 首次需联网加载运行环境。C++ / Rust 已预编译，无需外网，并提供对应源码；不支持任意代码在线编译。先在设备实时视图启动并初始化 VIO。</p></details></main><script>
const embedded=new URLSearchParams(location.search).get('embedded')==='1'&&parent!==window;if(embedded){document.documentElement.classList.add('embedded');const main=document.querySelector('main');let last=0;function resize(){const height=Math.ceil(main.getBoundingClientRect().height);if(height!==last){last=height;parent.postMessage({type:'neo-chapter-height',height},location.origin)}}new ResizeObserver(resize).observe(main);window.addEventListener('load',resize);resize();}
document.getElementById('open-example').addEventListener('submit',event=>{event.preventDefault();const value=document.getElementById('address').value.trim();try{const u=new URL(value.includes('://')?value:'http://'+value);const a=u.hostname.split('.');if(u.protocol!=='http:'||u.username||u.password||u.pathname!=='/'||u.search||u.hash||a.length!==4||!a.every(x=>/^[0-9]+$/.test(x)&&String(Number(x))===x&&Number(x)<=255))throw Error();const target=u.origin+'/examples.html?language='+document.getElementById('language').value;document.getElementById('error').textContent='';window.open(target,'_blank','noopener,noreferrer');}catch{document.getElementById('error').textContent='请输入有效的设备 IPv4 地址，可附带端口。';}});
</script></body></html>
