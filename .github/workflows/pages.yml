name: Publish product website and documentation
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  release:
    types: [published, edited]
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r source/requirements.txt
      - name: Validate SDK snapshot and downloads
        run: |
          python -m unittest discover -s tools -p test_public_update_contract.py
          python tools/check_sdk.py
      - name: Validate documentation
        run: python -m sphinx -b html -W --keep-going source tmp/docs
      - name: Build product website
        run: python tools/build_site.py
      - name: Verify shared content and links
        run: python tools/check_site.py
      - name: Check publication safety
        run: |
          python -m unittest discover -s tools -p test_check_site_security.py
          python tools/check_site_security.py tmp/site
      - name: Verify deployed documentation links
        run: python tools/check_docs.py tmp/site/docs
      - name: Verify short-video tutorials and transcripts
        run: python tools/check_web_tutorials.py tmp/site/docs
      - name: Build English and Chinese website
        run: python tools/build_locales.py
      - name: Validate localized publication
        run: |
          python tools/check_locales.py
          python tools/check_video_locales.py
          python tools/check_docs.py tmp/site/docs
          python tools/check_docs.py tmp/site/zh/docs
          python tools/check_site_security.py tmp/site
      - name: Mirror verified firmware to Pages
        run: |
          python -m unittest discover -s tools -p test_publish_firmware.py
          python tools/publish_firmware.py
          python tools/check_site_security.py tmp/site
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: firmware-manifest
          path: firmware/latest.json
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: tmp/site
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: actions/download-artifact@v4
        with:
          name: firmware-manifest
          path: firmware
      - name: Update raw firmware manifest after successful deployment
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add firmware/latest.json
          if ! git diff --cached --quiet; then
            git commit -m "Update published firmware manifest"
            git pull --rebase origin master
            git push origin HEAD:master
          fi
