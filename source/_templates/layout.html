{% extends '!layout.html' %}
{% block docs_navbar %}
{% set product_root = '../' * (pagename.count('/') + 1) %}
<header id="pst-header" class="bd-header neo-header d-print-none">
  <div class="neo-header-inner">
    <a class="neo-brand" href="{{ product_root }}" aria-label="RoboBaton Neo 产品首页"><svg class="neo-mark" width="32" height="32" viewBox="18 26 60 60" fill="none" aria-hidden="true" focusable="false"><path d="M62 31.751 A28 28 0 1 0 72.249 42" stroke="currentColor" stroke-width="4" stroke-linecap="round"/><path d="M38 66.5 V45.5 L58 66.5 V45.5" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="67.799" cy="36.201" r="3.2" fill="currentColor"/></svg>RoboBaton <strong>Neo</strong></a>
    <nav class="neo-navigation" aria-label="产品与文档导航">
      <a href="{{ product_root }}">产品介绍</a>
      <a href="{{ product_root }}quick-start.html">快速开始</a>
      <a href="{{ pathto('index') }}" aria-current="page">文档中心</a>
      <a class="neo-search-link" href="{{ pathto('search') }}" aria-label="搜索文档">搜索</a>
    </nav>
  </div>
</header>
{% endblock %}
{% block docs_toc %}
{% set page_toc = generate_toc_html() %}
{% if page_toc | length >= 1 %}
<aside class="docs-toc-rail d-print-none" aria-label="本页目录">
<details class="docs-page-toc">
  <summary>目录</summary>
  <nav aria-label="本页目录">{{ page_toc }}</nav>
</details>
</aside>
{% endif %}
{% endblock %}
