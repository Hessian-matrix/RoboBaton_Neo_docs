<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 380" role="img"><title>TF卡准备与检查流程，非插入朝向图</title><rect width="100%" height="100%" rx="16" fill="#f6faf7"/><g font-family="Microsoft YaHei, sans-serif" fill="#264b3a" font-size="16"><rect x="50" y="15" width="340" height="55" rx="10" fill="white" stroke="#a8c6b5"/><text x="220.0" y="43" text-anchor="middle" font-weight="600">① 停止任务，初次安装先断电</text><path d="M220 70 L220 100" stroke="#4d8468" stroke-width="2" fill="none"/><path d="M220 100 l-5 -8 m5 8 l5 -8" stroke="#4d8468" stroke-width="2" fill="none"/><rect x="50" y="105" width="340" height="55" rx="10" fill="white" stroke="#a8c6b5"/><text x="220.0" y="133" text-anchor="middle" font-weight="600">② 按实物卡槽标识插卡</text><path d="M220 160 L220 190" stroke="#4d8468" stroke-width="2" fill="none"/><path d="M220 190 l-5 -8 m5 8 l5 -8" stroke="#4d8468" stroke-width="2" fill="none"/><rect x="50" y="195" width="340" height="65" rx="10" fill="white" stroke="#a8c6b5"/><text x="220.0" y="223" text-anchor="middle" font-weight="600">③ 上电，打开数据管理</text><text x="220.0" y="246" text-anchor="middle" font-size="14">等待检查与挂载，确认 ready</text><path d="M220 260 L220 290" stroke="#4d8468" stroke-width="2" fill="none"/><path d="M220 290 l-5 -8 m5 8 l5 -8" stroke="#4d8468" stroke-width="2" fill="none"/><rect x="50" y="295" width="340" height="65" rx="10" fill="white" stroke="#a8c6b5"/><text x="220.0" y="323" text-anchor="middle" font-weight="600">④ 检查空间与录制能力</text><text x="220.0" y="346" text-anchor="middle" font-size="14">停止录制并等待收尾后再取卡</text></g></svg>